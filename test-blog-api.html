<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Blog API Tester</title>
     <style>
          * {
               box-sizing: border-box;
               margin: 0;
               padding: 0;
          }

          body {
               font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
               min-height: 100vh;
               padding: 20px;
          }

          .container {
               max-width: 1200px;
               margin: 0 auto;
               background: white;
               border-radius: 15px;
               box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
               overflow: hidden;
          }

          .header {
               background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
               color: white;
               text-align: center;
               padding: 30px;
          }

          .header h1 {
               font-size: 2.5em;
               margin-bottom: 10px;
          }

          .content {
               padding: 30px;
          }

          .section {
               margin-bottom: 40px;
               border: 1px solid #e1e5e9;
               border-radius: 10px;
               overflow: hidden;
          }

          .section-header {
               background: #f8f9fa;
               padding: 15px 20px;
               border-bottom: 1px solid #e1e5e9;
               font-weight: bold;
               color: #495057;
          }

          .section-content {
               padding: 20px;
          }

          .form-group {
               margin-bottom: 20px;
          }

          .form-group label {
               display: block;
               margin-bottom: 8px;
               font-weight: 600;
               color: #495057;
          }

          .form-group input,
          .form-group textarea,
          .form-group select {
               width: 100%;
               padding: 12px;
               border: 2px solid #e1e5e9;
               border-radius: 8px;
               font-size: 14px;
               transition: border-color 0.3s ease;
          }

          .form-group input:focus,
          .form-group textarea:focus,
          .form-group select:focus {
               outline: none;
               border-color: #4facfe;
          }

          .form-group textarea {
               resize: vertical;
               min-height: 100px;
          }

          .btn {
               padding: 12px 24px;
               border: none;
               border-radius: 8px;
               cursor: pointer;
               font-weight: 600;
               font-size: 14px;
               transition: all 0.3s ease;
               margin-right: 10px;
               margin-bottom: 10px;
          }

          .btn-primary {
               background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
               color: white;
          }

          .btn-success {
               background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
               color: white;
          }

          .btn-warning {
               background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
               color: white;
          }

          .btn-danger {
               background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
               color: white;
          }

          .btn:hover {
               transform: translateY(-2px);
               box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
          }

          .response {
               margin-top: 20px;
               padding: 15px;
               border-radius: 8px;
               font-family: 'Courier New', monospace;
               white-space: pre-wrap;
               max-height: 400px;
               overflow-y: auto;
          }

          .response.success {
               background: #d4edda;
               border: 1px solid #c3e6cb;
               color: #155724;
          }

          .response.error {
               background: #f8d7da;
               border: 1px solid #f5c6cb;
               color: #721c24;
          }

          .token-status {
               padding: 10px;
               border-radius: 5px;
               margin-bottom: 20px;
               font-weight: bold;
          }

          .token-status.valid {
               background: #d4edda;
               color: #155724;
          }

          .token-status.invalid {
               background: #f8d7da;
               color: #721c24;
          }

          .blog-posts-grid {
               display: grid;
               grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
               gap: 20px;
               margin-top: 20px;
          }

          .blog-post-card {
               border: 1px solid #e1e5e9;
               border-radius: 10px;
               padding: 15px;
               background: #f8f9fa;
          }

          .blog-post-card h4 {
               color: #495057;
               margin-bottom: 10px;
          }

          .blog-post-card p {
               color: #6c757d;
               font-size: 14px;
               margin-bottom: 10px;
          }

          .blog-post-actions {
               display: flex;
               gap: 10px;
               margin-top: 15px;
          }

          .file-upload {
               border: 2px dashed #e1e5e9;
               border-radius: 8px;
               padding: 20px;
               text-align: center;
               transition: border-color 0.3s ease;
          }

          .file-upload:hover {
               border-color: #4facfe;
          }

          .hidden {
               display: none;
          }
     </style>
</head>

<body>
     <div class="container">
          <div class="header">
               <h1>🚀 Blog API Tester</h1>
               <p>Test your blog post API endpoints with ease</p>
          </div>

          <div class="content">
               <!-- Authentication Section -->
               <div class="section">
                    <div class="section-header">
                         🔐 Authentication
                    </div>
                    <div class="section-content">
                         <div id="tokenStatus" class="token-status invalid">
                              No token set
                         </div>

                         <div class="form-group">
                              <label for="username">Username:</label>
                              <input type="text" id="username" value="testuser" placeholder="Enter username">
                         </div>

                         <div class="form-group">
                              <label for="password">Password:</label>
                              <input type="password" id="password" value="password123" placeholder="Enter password">
                         </div>

                         <button class="btn btn-primary" onclick="login()">🔑 Login</button>
                         <button class="btn btn-warning" onclick="clearToken()">🗑️ Clear Token</button>

                         <div id="loginResponse" class="response hidden"></div>
                    </div>
               </div>

               <!-- Create Blog Post Section -->
               <div class="section">
                    <div class="section-header">
                         ✍️ Create Blog Post
                    </div>
                    <div class="section-content">
                         <div class="form-group">
                              <label for="createTitle">Title:</label>
                              <input type="text" id="createTitle" placeholder="Enter blog post title">
                         </div>

                         <div class="form-group">
                              <label for="createContent">Content:</label>
                              <textarea id="createContent" placeholder="Enter blog post content"></textarea>
                         </div>

                         <div class="form-group">
                              <label for="createThumbnail">Thumbnail Image:</label>
                              <div class="file-upload">
                                   <input type="file" id="createThumbnail" accept="image/*">
                                   <p>Click to select or drag & drop an image</p>
                              </div>
                         </div>

                         <button class="btn btn-success" onclick="createBlogPost()">📝 Create Post</button>

                         <div id="createResponse" class="response hidden"></div>
                    </div>
               </div>

               <!-- Get All Blog Posts Section -->
               <div class="section">
                    <div class="section-header">
                         📚 All Blog Posts
                    </div>
                    <div class="section-content">
                         <button class="btn btn-primary" onclick="getAllBlogPosts()">🔄 Refresh Posts</button>

                         <div id="allPostsResponse" class="response hidden"></div>
                         <div id="blogPostsGrid" class="blog-posts-grid"></div>
                    </div>
               </div>

               <!-- Get Specific Blog Post Section -->
               <div class="section">
                    <div class="section-header">
                         🔍 Get Specific Blog Post
                    </div>
                    <div class="section-content">
                         <div class="form-group">
                              <label for="getPostId">Post ID:</label>
                              <input type="text" id="getPostId" placeholder="Enter blog post ID">
                         </div>

                         <button class="btn btn-primary" onclick="getBlogPostById()">🔍 Get Post</button>

                         <div id="getPostResponse" class="response hidden"></div>
                    </div>
               </div>

               <!-- Update Blog Post Section -->
               <div class="section">
                    <div class="section-header">
                         ✏️ Update Blog Post
                    </div>
                    <div class="section-content">
                         <div class="form-group">
                              <label for="updatePostId">Post ID:</label>
                              <input type="text" id="updatePostId" placeholder="Enter blog post ID to update">
                         </div>

                         <div class="form-group">
                              <label for="updateTitle">Title:</label>
                              <input type="text" id="updateTitle" placeholder="Enter new title (optional)">
                         </div>

                         <div class="form-group">
                              <label for="updateContent">Content:</label>
                              <textarea id="updateContent" placeholder="Enter new content (optional)"></textarea>
                         </div>

                         <div class="form-group">
                              <label for="updateThumbnail">New Thumbnail Image:</label>
                              <div class="file-upload">
                                   <input type="file" id="updateThumbnail" accept="image/*">
                                   <p>Click to select or drag & drop a new image (optional)</p>
                              </div>
                         </div>

                         <button class="btn btn-warning" onclick="updateBlogPost()">✏️ Update Post</button>

                         <div id="updateResponse" class="response hidden"></div>
                    </div>
               </div>

               <!-- Delete Blog Post Section -->
               <div class="section">
                    <div class="section-header">
                         🗑️ Delete Blog Post
                    </div>
                    <div class="section-content">
                         <div class="form-group">
                              <label for="deletePostId">Post ID:</label>
                              <input type="text" id="deletePostId" placeholder="Enter blog post ID to delete">
                         </div>

                         <button class="btn btn-danger" onclick="deleteBlogPost()">🗑️ Delete Post</button>

                         <div id="deleteResponse" class="response hidden"></div>
                    </div>
               </div>
          </div>
     </div>

     <script>
          const API_BASE_URL = 'http://localhost:5000/api/v1';
          let authToken = localStorage.getItem('authToken') || '';

          // Update token status on page load
          updateTokenStatus();

          function updateTokenStatus() {
               const statusElement = document.getElementById('tokenStatus');
               if (authToken) {
                    statusElement.textContent = `Token set: ${authToken.substring(0, 20)}...`;
                    statusElement.className = 'token-status valid';
               } else {
                    statusElement.textContent = 'No token set';
                    statusElement.className = 'token-status invalid';
               }
          }

          function showResponse(elementId, response, isError = false) {
               const element = document.getElementById(elementId);
               element.textContent = JSON.stringify(response, null, 2);
               element.className = `response ${isError ? 'error' : 'success'}`;
               element.classList.remove('hidden');
          }

          function hideResponse(elementId) {
               document.getElementById(elementId).classList.add('hidden');
          }

          async function makeRequest(url, options = {}) {
               try {
                    const response = await fetch(`${API_BASE_URL}${url}`, {
                         headers: {
                              'Authorization': authToken ? `Bearer ${authToken}` : '',
                              ...options.headers
                         },
                         ...options
                    });

                    const data = await response.json();

                    if (!response.ok) {
                         throw new Error(data.message || `HTTP ${response.status}`);
                    }

                    return data;
               } catch (error) {
                    throw error;
               }
          }

          async function login() {
               hideResponse('loginResponse');

               const username = document.getElementById('username').value;
               const password = document.getElementById('password').value;

               if (!username || !password) {
                    showResponse('loginResponse', { error: 'Username and password are required' }, true);
                    return;
               }

               try {
                    const response = await makeRequest('/auth/login', {
                         method: 'POST',
                         headers: {
                              'Content-Type': 'application/json'
                         },
                         body: JSON.stringify({ username, password })
                    });

                    authToken = response.data.token;
                    localStorage.setItem('authToken', authToken);
                    updateTokenStatus();
                    showResponse('loginResponse', response);
               } catch (error) {
                    showResponse('loginResponse', { error: error.message }, true);
               }
          }

          function clearToken() {
               authToken = '';
               localStorage.removeItem('authToken');
               updateTokenStatus();
          }

          async function createBlogPost() {
               hideResponse('createResponse');

               const title = document.getElementById('createTitle').value;
               const content = document.getElementById('createContent').value;
               const thumbnailFile = document.getElementById('createThumbnail').files[0];

               if (!title || !content) {
                    showResponse('createResponse', { error: 'Title and content are required' }, true);
                    return;
               }

               try {
                    const formData = new FormData();
                    formData.append('title', title);
                    formData.append('content', content);

                    if (thumbnailFile) {
                         formData.append('thumbnail', thumbnailFile);
                    }

                    const response = await fetch(`${API_BASE_URL}/blog-posts`, {
                         method: 'POST',
                         headers: {
                              'Authorization': `Bearer ${authToken}`// Note: This header is not needed for FormData, but included for clarity
                         },
                         body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) {
                         throw new Error(data.message || `HTTP ${response.status}`);
                    }

                    showResponse('createResponse', data);

                    // Clear form
                    document.getElementById('createTitle').value = '';
                    document.getElementById('createContent').value = '';
                    document.getElementById('createThumbnail').value = '';

                    // Refresh posts list
                    getAllBlogPosts();
               } catch (error) {
                    showResponse('createResponse', { error: error.message }, true);
               }
          }

          async function getAllBlogPosts() {
               hideResponse('allPostsResponse');

               try {
                    const response = await makeRequest('/blog-posts');
                    showResponse('allPostsResponse', response);
                    displayBlogPosts(response.data || response);
               } catch (error) {
                    showResponse('allPostsResponse', { error: error.message }, true);
               }
          }

          function displayBlogPosts(posts) {
               const grid = document.getElementById('blogPostsGrid');
               grid.innerHTML = '';

               if (!posts || posts.length === 0) {
                    grid.innerHTML = '<p>No blog posts found.</p>';
                    return;
               }

               posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'blog-post-card';
                    card.innerHTML = `
                    <h4>${post.title}</h4>
                    <p><strong>ID:</strong> ${post._id}</p>
                    <p><strong>Content:</strong> ${post.content.substring(0, 100)}${post.content.length > 100 ? '...' : ''}</p>
                    <p><strong>Created:</strong> ${new Date(post.createdAt).toLocaleString()}</p>
                    ${post.thumbnail ? `<p><strong>Thumbnail:</strong> ${post.thumbnail}</p>` : ''}
                    <div class="blog-post-actions">
                        <button class="btn btn-primary" onclick="fillGetForm('${post._id}')">🔍 View</button>
                        <button class="btn btn-warning" onclick="fillUpdateForm('${post._id}', '${post.title}', '${post.content}')">✏️ Edit</button>
                        <button class="btn btn-danger" onclick="fillDeleteForm('${post._id}')">🗑️ Delete</button>
                    </div>
                `;
                    grid.appendChild(card);
               });
          }

          function fillGetForm(postId) {
               document.getElementById('getPostId').value = postId;
          }

          function fillUpdateForm(postId, title, content) {
               document.getElementById('updatePostId').value = postId;
               document.getElementById('updateTitle').value = title;
               document.getElementById('updateContent').value = content;
          }

          function fillDeleteForm(postId) {
               document.getElementById('deletePostId').value = postId;
          }

          async function getBlogPostById() {
               hideResponse('getPostResponse');

               const postId = document.getElementById('getPostId').value;

               if (!postId) {
                    showResponse('getPostResponse', { error: 'Post ID is required' }, true);
                    return;
               }

               try {
                    const response = await makeRequest(`/blog-posts/${postId}`);
                    showResponse('getPostResponse', response);
               } catch (error) {
                    showResponse('getPostResponse', { error: error.message }, true);
               }
          }

          async function updateBlogPost() {
               hideResponse('updateResponse');

               const postId = document.getElementById('updatePostId').value;
               const title = document.getElementById('updateTitle').value;
               const content = document.getElementById('updateContent').value;
               const thumbnailFile = document.getElementById('updateThumbnail').files[0];

               if (!postId) {
                    showResponse('updateResponse', { error: 'Post ID is required' }, true);
                    return;
               }

               try {
                    const formData = new FormData();

                    if (title) formData.append('title', title);
                    if (content) formData.append('content', content);
                    if (thumbnailFile) formData.append('thumbnail', thumbnailFile);

                    const response = await fetch(`${API_BASE_URL}/blog-posts/${postId}`, {
                         method: 'PUT',
                         headers: {
                              'Authorization': `Bearer ${authToken}`
                         },
                         body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) {
                         throw new Error(data.message || `HTTP ${response.status}`);
                    }

                    showResponse('updateResponse', data);

                    // Clear form
                    document.getElementById('updatePostId').value = '';
                    document.getElementById('updateTitle').value = '';
                    document.getElementById('updateContent').value = '';
                    document.getElementById('updateThumbnail').value = '';

                    // Refresh posts list
                    getAllBlogPosts();
               } catch (error) {
                    showResponse('updateResponse', { error: error.message }, true);
               }
          }

          async function deleteBlogPost() {
               hideResponse('deleteResponse');

               const postId = document.getElementById('deletePostId').value;

               if (!postId) {
                    showResponse('deleteResponse', { error: 'Post ID is required' }, true);
                    return;
               }

               if (!confirm('Are you sure you want to delete this blog post?')) {
                    return;
               }

               try {
                    const response = await makeRequest(`/blog-posts/${postId}`, {
                         method: 'DELETE'
                    });
                    showResponse('deleteResponse', response);

                    // Clear form
                    document.getElementById('deletePostId').value = '';

                    // Refresh posts list
                    getAllBlogPosts();
               } catch (error) {
                    showResponse('deleteResponse', { error: error.message }, true);
               }
          }

          // Load blog posts on page load
          if (authToken) {
               getAllBlogPosts();
          }
     </script>
</body>

</html>
